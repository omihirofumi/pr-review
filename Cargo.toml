[package]
name = "prpr"
version = "0.8.0"
edition = "2024"
description = "Review GitHub PRs and local Jujutsu diffs with Helix and AI explanations"
license = "MIT"
default-run = "prpr"

[[bin]]
name = "prpr"
path = "src/bin/prpr.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
rustix = { version = "1", features = ["termios"] }
tempfile = "3"
toml = "1.2.1"
tui-markdown = { version = "0.3.13", default-features = false }

[dev-dependencies]

